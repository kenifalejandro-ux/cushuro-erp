version: 2
updates:
  # Backend (raíz del repo)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Junta las actualizaciones menores/patch en un solo PR en vez de uno
      # por paquete — evita que 15 PRs triviales tapen los que sí importan
      # (majors, o los que arreglan una vulnerabilidad real).
      minor-y-patch:
        update-types: ["minor", "patch"]
    ignore:
      # pino (^9.x) y pino-http (^10.5.0) tienen que moverse juntos a una
      # versión mayor — pino-http@11 ya no es compatible con pino@9 (visto
      # en el PR #33, cerrado 2026-08-05), y antes ya habíamos visto que
      # pino@10 tampoco era compatible con pino-http@10.5.0 (PR #13). O sea:
      # subir cualquiera de los dos solo, sin el otro, rompe el typecheck de
      # app.ts. Sacar ambos ignores juntos, a mano, cuando se decida migrar
      # los dos a la vez a versiones compatibles entre sí.
      - dependency-name: "pino"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pino-http"
        update-types: ["version-update:semver-major"]
      # @types/express-serve-static-core@5.x rompe la extensión de tipos
      # custom de Request (usuario, validatedBody) que agregan los
      # middlewares propios — necesita migrar esa extensión antes de subir
      # (visto en el PR #11, cerrado 2026-08-05). Mismo motivo exacto con
      # express + @types/express en conjunto (visto en el PR #43, cerrado
      # 2026-08-05).
      - dependency-name: "@types/express-serve-static-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
      # zod v4 sacó `required_error`/`invalid_type_error` de los schemas en
      # favor de un `error` unificado — rompe auth.schema.ts (y
      # probablemente otros schemas del proyecto que usan la sintaxis
      # vieja). Migrar todos los schemas antes de subir (visto en el PR #6,
      # cerrado 2026-08-05).
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]

  # Frontend (client/)
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-y-patch:
        update-types: ["minor", "patch"]
    # ⚠️ PUNTO CIEGO: `xlsx` se instala desde un tarball del CDN de SheetJS,
    # no desde el registry — Dependabot y `npm audit` NO pueden revisarlo.
    # No es un descuido: SheetJS se fue de npm en 2023 y dejó el paquete
    # `xlsx` del registry congelado en 0.18.5, que arrastra la prototype
    # pollution de CVE-2023-30533. Volver a npm sería BAJAR a una CVE
    # conocida; el CDN es la distribución oficial y hoy da 0.20.3 (con esa
    # CVE y la ReDoS de CVE-2024-22363 ya corregidas).
    #
    # La URL está fijada a la versión exacta (`xlsx-0.20.3/`), no a
    # `xlsx-latest/`: esa última es mutable y el día que SheetJS publique,
    # el hash del lockfile deja de coincidir y `npm ci` revienta en CI sin
    # que nadie haya tocado nada.
    #
    # A cambio, actualizar es MANUAL: revisar https://cdn.sheetjs.com/
    # cada tanto y al subir de versión cambiar la URL en client/package.json
    # y correr `npm install --package-lock-only`.
    ignore:
      # TypeScript 7 rompe el tsconfig.json de client/ (moduleResolution:
      # "node10", baseUrl, rutas no relativas) — ESO se arregla fácil
      # (probado 2026-08-05: typecheck y build quedan limpios con
      # moduleResolution: "bundler" y paths relativos). El bloqueo real es
      # otro: @typescript-eslint/typescript-estree (probado hasta la
      # última alpha, 8.66.1-alpha.4) declara
      # `peerDependencies: { typescript: ">=4.8.4 <6.1.0" }` — ninguna
      # versión disponible hoy soporta TS7, revienta con un TypeError
      # interno al correr `npm run lint`. Sacar este ignore cuando
      # @typescript-eslint publique soporte para TS7 (visto en el PR #20,
      # cerrado 2026-08-05).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions, si en algún momento se agrega CI (no hace daño tenerlo
  # ya configurado, Dependabot simplemente no encuentra nada que revisar
  # hasta que exista un workflow).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
