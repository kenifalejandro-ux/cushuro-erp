name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analizar
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

      - name: Fallar si hay alertas de severidad alta/crítica
        # El paso de análisis de arriba nunca falla el job solo por
        # encontrar alertas (solo sube el SARIF a la pestaña Security) —
        # este paso consulta esas alertas por API y corta el pipeline si
        # alguna abierta, del commit que se acaba de analizar, es
        # "high" o "critical".
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.eventName === "pull_request"
              ? context.payload.pull_request.head.sha
              : context.sha;

            const alerts = await github.paginate(
              github.rest.codeScanning.listAlertsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, state: "open" }
            );

            const criticas = alerts.filter((a) => {
              const nivel = a.rule?.security_severity_level;
              const enEsteCommit = a.most_recent_instance?.commit_sha === sha;
              return enEsteCommit && (nivel === "high" || nivel === "critical");
            });

            if (criticas.length > 0) {
              core.setFailed(
                `Se encontraron ${criticas.length} alerta(s) de CodeQL de severidad alta/crítica:\n` +
                criticas.map((a) => `- ${a.rule.description} (${a.html_url})`).join("\n")
              );
            }
