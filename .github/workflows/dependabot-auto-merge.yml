name: Dependabot auto-merge

# pull_request_target (no pull_request): así el workflow que corre es el
# de la rama base (main), no el que trae el propio PR de Dependabot — evita
# que un PR pudiera traer un workflow modificado con permisos elevados.
on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Leer metadata del PR (tipo de actualización)
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Solo patch/minor. Un major NUNCA se auto-mergea — se queda
      # esperando revisión manual, que es justo lo que debe requerir
      # atención humana.
      - name: Aprobar y activar auto-merge (solo patch/minor)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
