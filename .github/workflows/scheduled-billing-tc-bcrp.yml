name: Scheduled Billing Tipo de Cambio BCRP

# Job diario que trae el tipo de cambio USD -> PEN del BCRP (API pública,
# serie PD04638PD -- TC Interbancario Venta) y lo guarda como el nuevo TC
# global de plataforma (migración 0053, platformTipoCambio.service.ts).
# Mismo patrón que scheduled-billing-vencimientos.yml -- corre en
# infraestructura de GitHub y llama al endpoint interno en vez de tocar el
# BCRP o la base directo desde el proceso de Node.

on:
  schedule:
    - cron: "0 13 * * *" # Todos los días 13:00 UTC (~8am Perú), el BCRP ya publicó el cierre del día hábil anterior
  workflow_dispatch: # Para poder dispararlo a mano desde la pestaña Actions

jobs:
  actualizar-tipo-cambio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Actualizar tipo de cambio desde BCRP
        env:
          PROD_API_URL: ${{ vars.PRODUCTION_URL }}
          PLATFORM_ADMIN_TOKEN: ${{ secrets.PLATFORM_ADMIN_TOKEN }}
        run: |
          echo "=== Actualizando tipo de cambio USD -> PEN desde el BCRP ==="

          if [ -z "$PROD_API_URL" ] || [ -z "$PLATFORM_ADMIN_TOKEN" ]; then
            echo "Error: faltan vars.PRODUCTION_URL o secrets.PLATFORM_ADMIN_TOKEN en el repositorio."
            exit 1
          fi

          API="${PROD_API_URL}/api/platform"

          http_ok() {
            [ "$1" -ge 200 ] && [ "$1" -lt 300 ]
          }

          RESPONSE=$(curl -sS --max-time 30 -w "\n%{http_code}" -X POST "${API}/billing/tipo-cambio/actualizar-desde-bcrp" \
            -H "Authorization: Bearer ${PLATFORM_ADMIN_TOKEN}")
          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)

          if ! http_ok "$HTTP_CODE"; then
            echo "Error: no se pudo actualizar el tipo de cambio (HTTP $HTTP_CODE)"
            echo "$HTTP_BODY"
            exit 1
          fi

          echo "$HTTP_BODY"
          echo "=== Tipo de cambio actualizado correctamente ==="
